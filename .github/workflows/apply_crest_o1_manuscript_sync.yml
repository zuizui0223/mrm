name: Apply CREST-O1 manuscript synchronization

on:
  push:
    branches: [agent/crest-o1-manuscript-sync]

permissions:
  contents: write

jobs:
  apply-o1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crest-o1-manuscript-sync
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Insert O1 paragraph and claim controls
        run: |
          python - <<'PY'
          from pathlib import Path

          manuscript = Path('manuscript/crest_philosophy_biology_philosophy.md')
          text = manuscript.read_text()
          marker = '## 4. Contract-relative does not mean arbitrary'
          o1_marker = 'CREST-O1 makes this distinction concrete.'
          paragraph = '''CREST-O1 makes this distinction concrete. In a finite controlled-system witness, the unique cheapest carrier repair costs one unit: it installs a local fallback and makes the synchronized carrier viable. Yet that fallback creates a downstream J1 state distinction that the declared evidence does not resolve, so the full repaired state is not deterministically reportable even though the requested target remains constant and reportable. A different repair, costing two units, blocks an uncontrollable hazard instead; its downstream state has one class and is fully evidence-licensed. Thus the minimum cost of structural feasibility can be strictly smaller than the minimum cost of a fully licensed state. This does not make the costlier repair intrinsically or normatively better. It shows that carrier feasibility, state-representation adequacy, and evidential reportability are different optimization targets, so optimizing the first alone does not guarantee the others.'''
          if o1_marker not in text:
              if text.count(marker) != 1:
                  raise SystemExit('manuscript insertion marker is missing or non-unique')
              text = text.replace(marker, paragraph + '\n\n' + marker)
              manuscript.write_text(text)

          ledger = Path('docs/crest_philosophy_claim_ledger_2026-08-17.md')
          ledger_text = ledger.read_text()
          if '### C37 — strict repair/licensing separation' not in ledger_text:
              ledger_text += '''\n\n---\n\n## O1 integration controls — 2026-08-18\n\n### C37 — strict repair/licensing separation\n\n- **Type:** FORMAL.\n- **Allowed:** the finite witness proves `R_structural^* = 1 < R_licensed^* = 2`.\n- **Source:** `docs/crest_repair_evidence_noncommutation_2026-08-18.md` and `tests/test_crest_repair_evidence_noncommutation.py`.\n\n### C38 — full-state versus target-only licensing\n\n- **Type:** FORMAL.\n- **Allowed:** the cost-1 repair leaves the full J1 state unlicensed while the target remains reportable; the cost-2 repair is fully licensed.\n- **Boundary:** do not rewrite required state resolution as an observed state.\n\n### C39 — distinct optimization targets\n\n- **Type:** INTERPRETIVE.\n- **Allowed:** carrier feasibility, state-representation adequacy, and evidential licensing should remain diagnostically distinct.\n- **Dependency:** C37–C38.\n\n### C40 — rejected normative and priority readings\n\n- **Type:** REJECT.\n- **Forbidden:** the costlier repair is ecologically better, CREST imposes one mandatory workflow, or CREST first discovered observability-aware repair.\n'''
              ledger.write_text(ledger_text)
          PY

      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify manuscript and theorem suite
        run: |
          python scripts/verify_crest_philosophy_submission.py --write-report
          pytest -q

      - name: Refresh handoff and audit from verifier report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('artifacts/crest_philosophy_submission_report.json')
          if not report_path.exists():
              candidates = sorted(Path('artifacts').glob('*crest*philosophy*report*.json'))
              if not candidates:
                  raise SystemExit('submission report was not generated')
              report_path = candidates[0]
          report = json.loads(report_path.read_text())
          report_json = json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True)

          handoff = Path('manuscript/biology_philosophy_submission_handoff.md')
          handoff_text = handoff.read_text()
          if '## G2. CREST-O1 integration status — 2026-08-18' not in handoff_text:
              handoff_text += f'''\n\n## G2. CREST-O1 integration status — 2026-08-18\n\nCompleted repository-controlled work:\n\n- one O1 diagnostic paragraph integrated into the Biology & Philosophy manuscript;\n- no new theorem section, acronym family, external citation, or priority claim;\n- C37–C40 added to the claim ledger;\n- theorem suite and submission verifier passed after integration.\n\nVerifier report:\n\n```json\n{report_json}\n```\n\nRemaining blockers are author-controlled: final human source/claim/text review, author and affiliation metadata, funding, competing interests, acknowledgements, final AI-disclosure approval, policy recheck, and visual read-through.\n'''
              handoff.write_text(handoff_text)

          audit = Path('docs/crest_biology_philosophy_submission_audit_2026-08-17.md')
          audit_text = audit.read_text()
          if '## 8. CREST-O1 integration re-audit — 2026-08-18' not in audit_text:
              audit_text += f'''\n\n## 8. CREST-O1 integration re-audit — 2026-08-18\n\n### Scope\n\nO1 was integrated as one diagnostic paragraph in the existing argument against collapsing all adequacy failures into one objective. It was not promoted to J8 or to a new theorem section.\n\n### Claim audit\n\n- **PASS:** exact witness only: `R_structural^* = 1 < R_licensed^* = 2`;\n- **PASS:** full-state licensing remains distinct from target-only reporting;\n- **PASS:** no claim that the costlier repair is normatively superior;\n- **PASS:** no mandatory audit order, exhaustiveness, commutation, or priority claim;\n- **PASS:** no new external citation used as proof of an internal theorem.\n\n### Automated verification\n\n```json\n{report_json}\n```\n\nFull pytest and `git diff --check` also passed on the integration branch. Final human review remains required before submission.\n'''
              audit.write_text(audit_text)
          PY

      - name: Final repository checks
        run: |
          python scripts/verify_crest_philosophy_submission.py --write-report
          git diff --check

      - name: Commit synchronized manuscript controls
        run: |
          rm .github/workflows/apply_crest_o1_manuscript_sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate CREST-O1 into the philosophy manuscript'
          git push origin HEAD:agent/crest-o1-manuscript-sync
